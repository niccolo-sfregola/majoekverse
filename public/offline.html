<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11102e" />
    <title>Offline · maJoekverse</title>
    <style>
      /* Tutto inline: questa pagina deve funzionare senza rete e senza altri file. */
      * { box-sizing: border-box; margin: 0; }
      html, body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
        text-align: center;
        background: #11102e;
        color: #f6ecd8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .icon { font-size: 3.25rem; line-height: 1; }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        max-width: 22rem;
        color: #b9a8e6;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.7rem 1.6rem;
        border: 0;
        border-radius: 0.75rem;
        background: #ef6c4e;
        color: #f6ecd8;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="icon">🛰️</div>
    <h1>Sei offline</h1>
    <p>
      Non c'è connessione. Riprova quando torni online: le pagine già viste
      restano disponibili.
    </p>
    <button onclick="location.reload()">Riprova</button>
  </body>
</html>
